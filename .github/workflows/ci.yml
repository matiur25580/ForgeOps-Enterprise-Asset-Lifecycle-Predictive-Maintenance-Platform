name: ForgeOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forgeops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check API and compile Angular app
        run: npm run typecheck
      - name: Build all workspaces
        run: npm run build